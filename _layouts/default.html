<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1">

  {% seo %}

  <link rel="stylesheet"
        href="{{ '/assets/css/style.css' | relative_url }}">

</head>

<body>

<header class="page-header" role="banner">

  <!-- ==============================
       LOGO + TITLE
  =============================== -->

  <div style="
      display:flex;
      justify-content:center;
      align-items:center;
      gap:20px;
      position:relative;
      z-index:10;
      flex-wrap:wrap;
      text-align:left;
      margin-bottom:15px;
  ">

      <img src="{{ '/assets/2026/Clogo.jpeg' | relative_url }}"
           alt="Quantum Kisholoy Logo"
           style="
             width:95px;
             height:95px;
             object-fit:contain;
             filter: drop-shadow(0 0 12px rgba(255,255,255,.4));
           ">

      <div>

        <h1 class="project-name">
          {{ page.header_title | default: site.title }}
        </h1>

        {% if page.description or site.description %}
        <h2 class="project-tagline">
          {{ page.description | default: site.description }}
        </h2>
        {% endif %}

      </div>

  </div>


  <!-- ==============================
       QUANTUM CIRCUIT
  =============================== -->

  <div class="quantum-circuit">

    <!-- LEFT CIRCUIT -->

    <div class="q-wire wire-1"></div>

    <span class="q-state state-0">|0⟩</span>

    <span class="q-gate gate-h">H</span>

    <span class="q-node node-1"></span>

    <span class="q-gate gate-x">X</span>


    <!-- RIGHT CIRCUIT -->

    <div class="q-wire wire-2"></div>

    <span class="q-state state-1">|1⟩</span>

    <span class="q-gate gate-h2">H</span>

    <span class="q-node node-2"></span>

    <span class="q-gate gate-z">Z</span>


    <!-- ENTANGLEMENT -->

    <div class="entangle-line"></div>


    <!-- MOVING PARTICLES -->

    <span class="q-particle particle-1"></span>

    <span class="q-particle particle-2"></span>


    <!-- ORBITS -->

    <div class="quantum-orbit orbit-left">
      <span></span>
    </div>

    <div class="quantum-orbit orbit-right">
      <span></span>
    </div>

  </div>

</header>


<!-- ==============================
     PAGE CONTENT
================================ -->

<main id="content" class="main-content" role="main">

{{ content }}

</main>

</body>

</html>
